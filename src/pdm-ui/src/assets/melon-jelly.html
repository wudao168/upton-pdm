const $=id=>document.getElementById(id), clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

 constructor(){

  this.layerSize=points.length;this.count=points.length*(L+1);this.p=new Float64Array(this.count*3);this.s=new Float32Array(this.count);
  for(let k=0;k<=L;k++)for(let i=0;i<points.length;i++){const q=(k*points.length+i)*3;this.p[q]=points[i][0];this.p[q+1]=points[i][1];this.p[q+2]=(k/L-.5)*2*halfDepth(points[i][0],points[i][1]);this.s[q/3]=points[i][2];}
  this.rest=this.p.slice();this.prev=this.p.slice();this.vel=new Float64Array(this.p.length);this.mass=new Float64Array(this.count);this.inv=new Float64Array(this.count);
  const ts=[];for(let k=0;k<L;k++)for(const tr of tris){const t=tr.slice().sort((a,b)=>a-b),a=t[0]+k*points.length,b=t[1]+k*points.length,c=t[2]+k*points.length,A=a+points.length,B=b+points.length,C=c+points.length;ts.push([a,b,c,C],[a,b,B,C],[a,A,B,C]);}
  this.tets=new Uint32Array(ts.length*4);this.volumes=new Float64Array(ts.length);this.vlambda=new Float64Array(ts.length);const edges=new Map(),faces=new Map();
  for(let k=0;k<ts.length;k++){const t=ts[k];if(signedVolume(this.p,...t.map(i=>i*3))<0)[t[1],t[2]]=[t[2],t[1]];this.tets.set(t,k*4);const v=signedVolume(this.p,...t.map(i=>i*3));this.volumes[k]=v;for(const i of t)this.mass[i]+=v/4;
   for(let a=0;a<4;a++)for(let b=a+1;b<4;b++){const x=Math.min(t[a],t[b]),y=Math.max(t[a],t[b]);edges.set(x+','+y,[x,y]);}
   for(const f of [[t[1],t[2],t[3]],[t[0],t[3],t[2]],[t[0],t[1],t[3]],[t[0],t[2],t[1]]]){const key=f.slice().sort((a,b)=>a-b).join(',');if(faces.has(key))faces.delete(key);else faces.set(key,f);}
  }
  this.surface=Array.from(faces.values());this.edges=new Uint32Array(Array.from(edges.values()).flat());this.lengths=new Float64Array(edges.size);this.elambda=new Float64Array(edges.size);this.edgeFirm=new Float64Array(edges.size);
  for(let k=0;k<this.lengths.length;k++){const a=this.edges[k*2],b=this.edges[k*2+1];this.lengths[k]=Math.hypot(...sub(Array.from(this.p.slice(a*3,a*3+3)),Array.from(this.p.slice(b*3,b*3+3))));this.edgeFirm[k]=this.s[a]>.82&&this.s[b]>.82?.32:1;}
  this.totalMass=this.mass.reduce((a,b)=>a+b,0);this.restVolume=this.volumes.reduce((a,b)=>a+b,0);for(let i=0;i<this.count;i++)this.inv[i]=1/this.mass[i];this.firmness=.45;this.damping=.35;this.grabs=new Map();this.steps=0;this.safeguards=0;
 }
 reset(){this.p.set(this.rest);this.prev.set(this.rest);this.vel.fill(0);this.grabs.clear();this.steps=0;this.safeguards=0;}
 nudge(dx=1){for(let i=0;i<this.count;i++){const h=this.p[i*3+1]/3;this.vel[i*3]+=dx*(.25+h*.75);this.vel[i*3+1]+=.35*h;this.vel[i*3+2]+=.45*h*Math.sin(this.rest[i*3]*1.2);}}
