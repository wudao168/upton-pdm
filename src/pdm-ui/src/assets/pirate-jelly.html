 const st=sim.state;for(const z of [-.5,0,.5])test('ship',sim.shipWorld([0,.2,z]),.39);test('ship',sim.shipWorld([0,1.25,.07]),.5);
 for(const palm of island.palms){for(const f of [.3,.6,.9])test('palm',V.add(palm.root,[0,palm.height*f,0]),f===.9?.27:.13,{palm});}
 if(best.type!=='orbit')return best;
 const water=renderer.plane(x,y,0);if(Math.abs(water[0])<2.6&&Math.abs(water[2])<2.6&&island.terrain(water[0],water[2])<.01)return {type:'water',p:water};
 for(const axis of[0,2])for(const sign of[-1,1]){const t=(sign*2.6-ray.o[axis])/ray.d[axis];if(t<=0)continue;const p=V.add(ray.o,V.mul(ray.d,t));if(p[1]<.02&&p[1]>-.96&&Math.abs(p[axis===0?2:0])<=2.65)return {type:'tilt',p};}
 return {type:'orbit'};
}
function endGesture(cancelled=false){if(gesture){if(gesture.type==='ship')sim.dragShip=null;if(gesture.type==='tilt')sim.setTilt(0,0);if(gesture.type==='body')sim.release(gesture.body,cancelled?[0,0,0]:gesture.velocity||[0,0,0]);}gesture=null;canvas.classList.remove('dragging');}
function attachInteractions(){
 canvas.addEventListener('contextmenu',e=>e.preventDefault());
 canvas.addEventListener('pointerdown',e=>{if(!ready)return;e.preventDefault();canvas.focus({preventScroll:true});canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);$('tooltip').classList.remove('visible');
  if(pointers.size===2){endGesture(true);const q=[...pointers.values()];pinchDistance=Math.hypot(q[1][0]-q[0][0],q[1][1]-q[0][1]);gesture={type:'pinch'};return;}
  const selected=e.button===2||e.altKey?{type:'orbit'}:pick(e.clientX,e.clientY);gesture={...selected,start:[e.clientX,e.clientY],last:[e.clientX,e.clientY],lastT:performance.now(),moved:false,velocity:[0,0,0]};canvas.classList.add('dragging');
  if(gesture.type==='body'){gesture.height=Math.max(.35,gesture.body.p[1]+.2);gesture.lastWorld=gesture.body.p.slice();}
  if(gesture.type==='water')sim.ripple(selected.p[0],selected.p[2],.055);
 });
 canvas.addEventListener('pointermove',e=>{
  if(!ready)return;if(pointers.has(e.pointerId))pointers.set(e.pointerId,[e.clientX,e.clientY]);
  if(pointers.size===2){const q=[...pointers.values()],distance=Math.hypot(q[1][0]-q[0][0],q[1][1]-q[0][1]);renderer.distance=clamp(renderer.distance*pinchDistance/Math.max(10,distance),6.8,18);pinchDistance=distance;return;}
  if(!gesture){if(e.pointerType==='mouse'&&performance.now()-lastHover>90){lastHover=performance.now();const p=pick(e.clientX,e.clientY),labels={ship:'点击开炮，拖动船只',chest:'点击开合宝箱',fire:'点击增强火焰',x:'点击挖出金币',body:'拖动拾取，松手投掷',palm:'拖动弯曲棕榈树',water:'拖动水面制造波浪',tilt:'拖动侧壁倾斜果冻'};if(labels[p.type]){$('tooltip').textContent=labels[p.type];$('tooltip').style.left=e.clientX+'px';$('tooltip').style.top=(e.clientY-13)+'px';$('tooltip').classList.add('visible');canvas.style.cursor=['ship','body','palm','tilt'].includes(p.type)?'grab':'pointer';}else{$('tooltip').classList.remove('visible');canvas.style.cursor='grab';}}return;}
  const dx=e.clientX-gesture.last[0],dy=e.clientY-gesture.last[1],dist=Math.hypot(e.clientX-gesture.start[0],e.clientY-gesture.start[1]);if(dist>5)gesture.moved=true;const dt=Math.max(.008,(performance.now()-gesture.lastT)/1000);
  if(gesture.type==='orbit'){renderer.yaw-=dx*.006;renderer.pitch=clamp(renderer.pitch+dy*.004,.22,1.15);}
  else if(gesture.type==='water'){let p=renderer.plane(e.clientX,e.clientY,0);if(Math.abs(p[0])<2.6&&Math.abs(p[2])<2.6)sim.ripple(p[0],p[2],clamp(Math.hypot(dx,dy)*.003,.01,.09),.14);}
  else if(gesture.type==='tilt'){const sx=(e.clientX-gesture.start[0])*.0014,sz=(e.clientY-gesture.start[1])*.0014;sim.setTilt(sx*Math.cos(renderer.yaw)+sz*Math.sin(renderer.yaw),sz*Math.cos(renderer.yaw)-sx*Math.sin(renderer.yaw));}
  else if(gesture.type==='ship'&&gesture.moved){const p=renderer.plane(e.clientX,e.clientY,.1);sim.dragShip={x:clamp(p[0],-1.5,1.55),z:clamp(p[2],.58,1.85)};}
  else if(gesture.type==='palm'){gesture.palm.bend=clamp(gesture.palm.bend-dx*.007,-.6,.6);gesture.palm.velocity=-dx*.12;}
  else if(gesture.type==='body'&&gesture.moved){let p=renderer.plane(e.clientX,e.clientY,gesture.height);p[0]=clamp(p[0],-2.4,2.4);p[2]=clamp(p[2],-2.4,2.4);sim.grab(gesture.body,p);gesture.velocity=V.sub(p,gesture.lastWorld).map(v=>clamp(v/dt,-5,5));gesture.velocity[1]=clamp(-dy*.06,-2,3);gesture.lastWorld=p;}
  gesture.last=[e.clientX,e.clientY];gesture.lastT=performance.now();
 });
 const up=e=>{if(!ready)return;pointers.delete(e.pointerId);if(gesture&&!gesture.moved&&gesture.type!=='pinch'){switch(gesture.type){case'ship':doFire();break;case'chest':chestTarget=chestTarget?0:1.32;toast(chestTarget?'已打开宝箱':'已关闭宝箱');break;case'fire':sim.flare();toast('已增强火焰');break;case'x':sim.dig();toast('已挖出三枚金币');break;case'palm':gesture.palm.velocity+=1.3;break;}}endGesture();};
 canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);endGesture(true);});canvas.addEventListener('pointerleave',()=>$('tooltip').classList.remove('visible'));
 canvas.addEventListener('wheel',e=>{e.preventDefault();if(ready)renderer.distance=clamp(renderer.distance*Math.exp(e.deltaY*.001),6.8,18);},{passive:false});
 window.addEventListener('blur',()=>{pointers.clear();endGesture(true);});
}
function frame(now){if(!ready)return;const dt=Math.min(.04,(now-lastFrame)/1000||1/60);lastFrame=now;if(!paused&&!document.hidden){clockTime+=dt;sim.step(dt,clockTime);chestVelocity+=((chestTarget-chestAngle)*36-chestVelocity*6)*dt;chestAngle=clamp(chestAngle+chestVelocity*dt,-.04,1.53);sim.chestOpen=chestAngle;island.update(clockTime,dt,chestAngle);}ship.update(sim.state,clockTime);renderer.render(clockTime);sim.cannonSide=Math.cos(sim.state.yaw)*(renderer.camera[0]-sim.state.x)-Math.sin(sim.state.yaw)*(renderer.camera[2]-sim.state.z)>=0?1:-1;if((now|0)%7<2)updateCounters();raf=requestAnimationFrame(frame);}
async function main(){
 try{if(!navigator.gpu){showFallback();return;}makeBase();island=buildIsland();ship=buildShip();sim=new Simulation(island,ship);renderer=new JellyRenderer(canvas,sim,island);renderer.reduced=reducedMotion.matches;await renderer.init();ready=true;configureControls();attachInteractions();setTime(.17);updateStatus();$('loading').style.display='none';sim.step(.016,0);island.update(0,0,0);window.PirateJelly={sim,renderer,island,ship,get paused(){return paused},get ready(){return ready},get time(){return clockTime}};raf=requestAnimationFrame(frame);if(paused)toast('已根据减少动态效果设置暂停，可点击继续');}
 catch(error){console.error(error);showFallback();}
}
$('retry').onclick=()=>location.reload();main();
