<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="goldTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0a3"/>
      <stop offset="1" stop-color="#f4bd31"/>
    </linearGradient>
    <linearGradient id="goldLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efb529"/>
      <stop offset="1" stop-color="#d38b06"/>
    </linearGradient>
    <linearGradient id="goldRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8920b"/>
      <stop offset="1" stop-color="#ad6500"/>
    </linearGradient>
    <linearGradient id="blueTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9cee9"/>
      <stop offset="1" stop-color="#5b96c4"/>
    </linearGradient>
    <linearGradient id="blueSide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8cba"/>
      <stop offset="1" stop-color="#2e6595"/>
    </linearGradient>
    <filter id="softShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#172033" flood-opacity="0.14"/>
    </filter>

    <symbol id="partIcon" viewBox="0 0 32 32">
      <path d="M16 3.3 27 8.8 16 14.3 5 8.8Z" fill="url(#goldTop)" stroke="#5b4310" stroke-width="1.15" stroke-linejoin="round"/>
      <path d="M5 8.8 16 14.3V27.2L5 21.6Z" fill="url(#goldLeft)" stroke="#5b4310" stroke-width="1.15" stroke-linejoin="round"/>
      <path d="M16 14.3 27 8.8V21.6L16 27.2Z" fill="url(#goldRight)" stroke="#5b4310" stroke-width="1.15" stroke-linejoin="round"/>
      <path d="M8 9.1 16 13.1 24 9.1" fill="none" stroke="#fff7cf" stroke-width="0.7" opacity="0.9"/>
    </symbol>

    <symbol id="assemblyIcon" viewBox="0 0 32 32">
      <path d="M10.4 3.4 19.4 7.9 10.4 12.4 1.5 7.9Z" fill="url(#blueTop)" stroke="#284f72" stroke-width="1.05" stroke-linejoin="round"/>
      <path d="M1.5 7.9 10.4 12.4V22.1L1.5 17.5Z" fill="#548fba" stroke="#284f72" stroke-width="1.05" stroke-linejoin="round"/>
      <path d="M10.4 12.4 19.4 7.9V17.5L10.4 22.1Z" fill="url(#blueSide)" stroke="#284f72" stroke-width="1.05" stroke-linejoin="round"/>
      <path d="M20.2 9.8 30.5 14.9 20.2 20.1 9.9 14.9Z" fill="#73a9d0" stroke="#234f72" stroke-width="1.1" stroke-linejoin="round"/>
      <path d="M9.9 14.9 20.2 20.1V28.6L9.9 23.4Z" fill="#3f7fae" stroke="#234f72" stroke-width="1.1" stroke-linejoin="round"/>
      <path d="M20.2 20.1 30.5 14.9V23.4L20.2 28.6Z" fill="#275e8a" stroke="#234f72" stroke-width="1.1" stroke-linejoin="round"/>
      <circle cx="9.8" cy="14.9" r="1.45" fill="#edf7ff" stroke="#285d8a" stroke-width="0.9"/>
      <circle cx="20.1" cy="20.1" r="1.45" fill="#edf7ff" stroke="#285d8a" stroke-width="0.9"/>
      <path d="M11.2 15.6 18.7 19.3" stroke="#246a9e" stroke-width="1.15"/>
    </symbol>

    <symbol id="drawingIcon" viewBox="0 0 32 32">
      <path d="M5.2 2.6h15.6l6 6v20.8H5.2Z" fill="#fcfdff" stroke="#4d5662" stroke-width="1.2" stroke-linejoin="round"/>
      <path d="M20.8 2.6v6h6" fill="#dce2e8" stroke="#4d5662" stroke-width="1.2" stroke-linejoin="round"/>
      <rect x="8.3" y="11" width="7.8" height="6.2" rx="0.4" fill="#e5eef7" stroke="#4776a0" stroke-width="0.9"/>
      <circle cx="21.3" cy="14.2" r="3.1" fill="none" stroke="#4d5662" stroke-width="0.9"/>
      <path d="M18.2 14.2h6.2M21.3 11.1v6.2" stroke="#8a949f" stroke-width="0.55"/>
      <path d="M8.3 20h15.5v6.1H8.3Z" fill="#f3f5f7" stroke="#68727d" stroke-width="0.8"/>
      <path d="M17.8 20v6.1M8.3 22.8h15.5M20.8 22.8v3.3" fill="none" stroke="#7c8792" stroke-width="0.65"/>
    </symbol>

    <symbol id="warningBadge" viewBox="0 0 12 12">
      <circle cx="6" cy="6" r="5.4" fill="#fff" stroke="#d83838" stroke-width="1.2"/>
      <path d="M6 2.7v4.2M6 8.9v.4" stroke="#d83838" stroke-width="1.35" stroke-linecap="round"/>
    </symbol>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="64" y="68" fill="#172033" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="28" font-weight="700">PDM 图档类型图标 · 参考方案 B</text>
  <text x="64" y="101" fill="#667085" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="15">接近 SolidWorks 经典图标语言：深色轮廓、金色实体、蓝色装配关系、灰白工程图</text>

  <g transform="translate(60 140)">
    <rect width="330" height="430" rx="18" fill="#fff" stroke="#dce2ea" filter="url(#softShadow)"/>
    <rect x="24" y="24" width="282" height="38" rx="10" fill="#eef6fc"/>
    <text x="44" y="50" fill="#234f72" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="18" font-weight="700">装配体 ASSEMBLY</text>
    <svg x="92" y="86" width="146" height="146" viewBox="0 0 32 32"><use href="#assemblyIcon"/></svg>
    <text x="165" y="258" text-anchor="middle" fill="#172033" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="600">两个蓝色实体 + 装配关系</text>
    <text x="165" y="286" text-anchor="middle" fill="#667085" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14">双体轮廓，视觉最复杂</text>
    <line x1="24" y1="312" x2="306" y2="312" stroke="#e4e8ee"/>
    <text x="30" y="345" fill="#667085" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13">实际显示尺寸</text>
    <svg x="44" y="363" width="16" height="16" viewBox="0 0 32 32"><use href="#assemblyIcon"/></svg>
    <text x="66" y="376" fill="#475467" font-family="Segoe UI, sans-serif" font-size="12">16 px</text>
    <svg x="128" y="361" width="20" height="20" viewBox="0 0 32 32"><use href="#assemblyIcon"/></svg>
    <text x="154" y="376" fill="#475467" font-family="Segoe UI, sans-serif" font-size="12">20 px</text>
    <svg x="218" y="359" width="24" height="24" viewBox="0 0 32 32"><use href="#assemblyIcon"/></svg>
    <text x="248" y="376" fill="#475467" font-family="Segoe UI, sans-serif" font-size="12">24 px</text>
  </g>

  <g transform="translate(435 140)">
    <rect width="330" height="430" rx="18" fill="#fff" stroke="#dce2ea" filter="url(#softShadow)"/>
    <rect x="24" y="24" width="282" height="38" rx="10" fill="#fff7e4"/>
    <text x="44" y="50" fill="#7d5400" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="18" font-weight="700">零件 PART</text>
    <svg x="92" y="86" width="146" height="146" viewBox="0 0 32 32"><use href="#partIcon"/></svg>
    <text x="165" y="258" text-anchor="middle" fill="#172033" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="600">单个金色三维实体</text>
    <text x="165" y="286" text-anchor="middle" fill="#667085" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14">单体轮廓，识别最直接</text>
    <line x1="24" y1="312" x2="306" y2="312" stroke="#e4e8ee"/>
    <text x="30" y="345" fill="#667085" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13">实际显示尺寸</text>
    <svg x="44" y="363" width="16" height="16" viewBox="0 0 32 32"><use href="#partIcon"/></svg>
    <text x="66" y="376" fill="#475467" font-family="Segoe UI, sans-serif" font-size="12">16 px</text>
    <svg x="128" y="361" width="20" height="20" viewBox="0 0 32 32"><use href="#partIcon"/></svg>
    <text x="154" y="376" fill="#475467" font-family="Segoe UI, sans-serif" font-size="12">20 px</text>
    <svg x="218" y="359" width="24" height="24" viewBox="0 0 32 32"><use href="#partIcon"/></svg>
    <text x="248" y="376" fill="#475467" font-family="Segoe UI, sans-serif" font-size="12">24 px</text>
  </g>

  <g transform="translate(810 140)">
    <rect width="330" height="430" rx="18" fill="#fff" stroke="#dce2ea" filter="url(#softShadow)"/>
    <rect x="24" y="24" width="282" height="38" rx="10" fill="#f1f3f6"/>
    <text x="44" y="50" fill="#4d5662" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="18" font-weight="700">工程图 DRAWING</text>
    <svg x="92" y="86" width="146" height="146" viewBox="0 0 32 32"><use href="#drawingIcon"/></svg>
    <text x="165" y="258" text-anchor="middle" fill="#172033" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="600">灰白图纸 + 视图 + 标题栏</text>
    <text x="165" y="286" text-anchor="middle" fill="#667085" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14">二维纸张轮廓，与实体完全区分</text>
    <line x1="24" y1="312" x2="306" y2="312" stroke="#e4e8ee"/>
    <text x="30" y="345" fill="#667085" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13">实际显示尺寸</text>
    <svg x="44" y="363" width="16" height="16" viewBox="0 0 32 32"><use href="#drawingIcon"/></svg>
    <text x="66" y="376" fill="#475467" font-family="Segoe UI, sans-serif" font-size="12">16 px</text>
    <svg x="128" y="361" width="20" height="20" viewBox="0 0 32 32"><use href="#drawingIcon"/></svg>
    <text x="154" y="376" fill="#475467" font-family="Segoe UI, sans-serif" font-size="12">20 px</text>
    <svg x="218" y="359" width="24" height="24" viewBox="0 0 32 32"><use href="#drawingIcon"/></svg>
    <text x="248" y="376" fill="#475467" font-family="Segoe UI, sans-serif" font-size="12">24 px</text>
  </g>

  <g transform="translate(60 610)">
    <rect width="1080" height="66" rx="12" fill="#fff" stroke="#dce2ea"/>
    <text x="24" y="27" fill="#344054" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="600">状态叠加规则</text>
    <svg x="145" y="13" width="34" height="34" viewBox="0 0 32 32"><use href="#partIcon"/></svg>
    <svg x="168" y="34" width="15" height="15" viewBox="0 0 12 12"><use href="#warningBadge"/></svg>
    <text x="191" y="37" fill="#667085" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13">缺失/未入库只叠加红色警告角标，不改变图档类型图标</text>
    <text x="24" y="52" fill="#667085" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12">区分原则：装配体看“双体+蓝色关系”，零件看“单个金色实体”，工程图看“灰白纸张+标题栏”。</text>
  </g>
</svg>
